spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/inventario}
spring.datasource.username=${DB_USER:inventario}
spring.datasource.password=${DB_PASSWORD:inventario123}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=50
server.port=${PORT:8080}

# ---- Sesion (JWT) ----
# En produccion se define JWT_SECRETO con una clave larga y secreta (minimo 32 caracteres)
app.jwt.secreto=${JWT_SECRETO:clave-de-desarrollo-cambiala-en-produccion-1234567890}
# Cuantos dias dura la sesion antes de volver a pedir la contrasena
app.jwt.dias=${JWT_DIAS:30}

# ---- CORS: desde que direcciones se puede usar el sistema ----
# localhost (esta PC), la red WiFi de la bodega (192.168.x.x / 10.x.x.x) y, en Railway, su dominio
app.cors.origenes=${CORS_ORIGENES:http://localhost:*,http://127.0.0.1:*,http://192.168.*.*:*,http://10.*.*.*:*}

# ---- Primer usuario (solo se usa si admin@tienda.com no existe) ----
app.admin.clave-inicial=${ADMIN_CLAVE:123456}
