spring.application.name=inventario-system

# --- Base de datos (PostgreSQL) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/inventario}
spring.datasource.username=${DB_USER:inventario}
spring.datasource.password=${DB_PASSWORD:inventario123}

# --- JPA / Hibernate ---
# Por ahora Hibernate crea las tablas. Luego lo pasamos a Flyway.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.flyway.enabled=false

# --- Servidor ---
server.port=${PORT:8080}
